services:
  # 1. Main Data & Soil Fertility API (FastAPI)
  - type: web
    name: agrismart-main-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python train_model.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MONGO_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # 2. Smart Irrigation Backend (FastAPI + SQLite)
  - type: web
    name: agrismart-irrigation-backend
    runtime: python
    rootDir: smart-irrigation-backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # 3. Voice Assistant Backend (Flask + Gemini / OpenAI)
  - type: web
    name: agrismart-voice-backend
    runtime: python
    rootDir: AgriVoiceAssistant_Flask/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -b 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # 4. Weather & Disaster Alert Service (Node.js + Twilio)
  - type: web
    name: agrismart-weather-alert
    runtime: node
    rootDir: weather-disaster-alert
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: CITY
        value: Delhi
      - key: WEATHER_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

  # 5. Smart Irrigation ML Node Server
  - type: web
    name: agrismart-irrigation-ml
    runtime: node
    rootDir: smart-irrigation-ml/backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
